name: Eaglervators
version: '1.0.1'
main: org.pawling.eaglervators.EaglervatorsPlugin
api-version: '1.21.11'
author: Pawling CSD Game Development
description: Finds the nearest major cliff to spawn and builds one protected soul-sand elevator.

commands:
  eaglervator:
    description: Eaglervators status and scan controls
    usage: /eaglervator <status|scan>
    permission: eaglervators.admin

permissions:
  eaglervators.admin:
    description: Allows Eaglervators status and scan commands
    default: op

softdepend: [EaglerCity, EaglerZombiesFall26]
