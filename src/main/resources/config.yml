world-name: ""

scan:
  radius-blocks: 128
  checks-per-tick: 300
  minimum-height-difference: 20
  cross-section-width: 5
  minimum-supporting-columns: 3
  supporting-column-height: 18
  plateau-depth: 3
  plateau-width: 3
  lower-plateau-tolerance: 6
  upper-plateau-tolerance: 8
  maximum-elevator-height: 160

generation:
  startup-delay-ticks: 60

# With City + Zombies, prefer a protected city/Undercity up/down lift.
# Without either plugin, existing cliff discovery continues to work.
undercity:
  prefer-city: true
